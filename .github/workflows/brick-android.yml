name: brick-android

# Builds the Brick Android app and attaches the installable APK to the run.
on:
  push:
    paths:
      - "brick/android/**"
      - ".github/workflows/brick-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brick/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: brick-apk
          path: brick/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
